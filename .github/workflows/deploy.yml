name: Backend Deploy

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [master]

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail
            cd /opt/globaloil/backend
            git fetch origin master
            git reset --hard origin/master

            docker compose -p globaloil --env-file .env \
              -f docker-compose.prod.yml -f docker-compose.vps.yml \
              up -d --build web daphne

            for attempt in $(seq 1 20); do
              if docker compose -p globaloil --env-file .env \
                -f docker-compose.prod.yml -f docker-compose.vps.yml \
                exec -T web python -c "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host':'muestraslubricantesglobal.com', 'X-Forwarded-Proto':'https'}); assert urllib.request.urlopen(request, timeout=5).status == 200"; then
                exit 0
              fi
              sleep 3
            done

            docker compose -p globaloil --env-file .env \
              -f docker-compose.prod.yml -f docker-compose.vps.yml logs --tail=100 web
            exit 1
