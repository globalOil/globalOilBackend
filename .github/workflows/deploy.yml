name: Backend Deploy

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
    branches: [master]

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy-production
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy backend over direct SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -euo pipefail

            container_id="$(docker ps -q --filter 'name=^/backend$')"
            test -n "$container_id"

            project_dir="$(docker inspect "$container_id" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}')"
            project_name="$(docker inspect "$container_id" --format '{{ index .Config.Labels "com.docker.compose.project" }}')"
            config_files="$(docker inspect "$container_id" --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}')"
            test -n "$project_dir"
            test -n "$project_name"
            test -n "$config_files"

            cd "$project_dir"
            git fetch origin master
            git switch master
            git reset --hard origin/master

            compose=(docker compose -p "$project_name")
            IFS=',' read -r -a files <<< "$config_files"
            for file in "${files[@]}"; do
              compose+=(-f "$file")
            done

            "${compose[@]}" up -d --build --force-recreate web daphne

            healthy=""
            for attempt in $(seq 1 20); do
              if docker exec backend python -c "import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/api/health/', headers={'Host':'muestraslubricantesglobal.com','X-Forwarded-Proto':'https'}); response=urllib.request.urlopen(req, timeout=5); print(response.read().decode()); assert response.status == 200"; then
                healthy="yes"
                break
              fi
              echo "Intento ${attempt}/20 falló; reintentando en 3 segundos..."
              sleep 3
            done

            if [ -z "$healthy" ]; then
              echo "La comprobación de salud del backend falló."
              docker logs --tail=100 backend
              exit 1
            fi

            "${compose[@]}" ps web daphne
            docker logs --tail=50 backend
            docker logs --tail=50 daphne
